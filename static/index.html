<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地语音识别 · Speech to Text</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z'/%3E%3Cpath d='M19 11a7 7 0 0 1-14 0M12 18v3' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link id="appStyles" rel="stylesheet" href="/static/css/style.css">
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('appStyles').href = './css/style.css';
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="9" y="3" width="6" height="11" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"></path>
          </svg>
        </div>
        <div>
          <h1>本地语音识别</h1>
          <p class="subtitle">faster-whisper · 离线运行 · 中文 / English</p>
        </div>
      </div>
      <div class="status-badge" id="statusBadge" data-state="loading">
        <span class="dot"></span>
        <span id="statusText">正在检测服务</span>
      </div>
    </header>

    <main class="panel">
      <section class="toolbar">
        <div class="lang-group" role="group" aria-label="识别语言">
          <button type="button" class="lang-btn is-active" data-lang="zh">中文</button>
          <button type="button" class="lang-btn" data-lang="en">English</button>
        </div>
        <span class="privacy-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 3 4 6v6c0 5 3.4 7.8 8 9 4.6-1.2 8-4 8-9V6l-8-3Z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
          音频仅在本机处理，不会上传至第三方
        </span>
      </section>

      <section class="input-grid">
        <article class="card">
          <div class="card-head">
            <h2>实时语音识别</h2>
            <span class="tag">最长 60 秒</span>
          </div>
          <div class="recorder">
            <button type="button" class="record-btn" id="recordBtn" aria-label="开始录音">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3"></rect>
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>
              </svg>
            </button>
            <div class="timer" id="timer">00:00</div>
            <div class="level-track" aria-hidden="true"><div class="level-fill" id="levelFill"></div></div>
            <p class="card-tip" id="recordTip">点击麦克风，录音时下方会陆续显示文字</p>
          </div>
        </article>

        <article class="card">
          <div class="card-head">
            <h2>上传音频</h2>
            <span class="tag">≤ 10MB</span>
          </div>
          <label class="dropzone" id="dropzone" tabindex="0">
            <input type="file" id="fileInput" accept=".wav,.mp3,.webm,.ogg,.m4a,.flac,audio/*" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 16V4m0 0L7 9m5-5 5 5"></path>
              <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
            </svg>
            <p class="drop-title">点击选择，或拖拽音频到此处</p>
            <p class="drop-meta">WAV / MP3 / WEBM / OGG / M4A / FLAC</p>
          </label>
          <div class="file-row" id="fileRow" hidden>
            <div class="file-info">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M9 18V6l10-2v12"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="16" cy="16" r="3"></circle>
              </svg>
              <span id="fileName"></span>
              <small id="fileSize"></small>
            </div>
            <button type="button" class="btn ghost small" id="clearFileBtn">移除</button>
          </div>
          <button type="button" class="btn primary block" id="uploadBtn" disabled>上传并识别</button>
        </article>
      </section>

      <section class="card result-card">
        <div class="card-head">
          <h2>识别结果</h2>
          <div class="result-meta" id="resultMeta" hidden>
            <span>语言 <b id="metaLang">--</b></span>
            <span>音频 <b id="metaDuration">--</b></span>
            <span>耗时 <b id="metaProcessing">--</b></span>
          </div>
        </div>
        <div class="result-body">
          <p class="placeholder" id="resultPlaceholder">识别出的文字会显示在这里</p>
          <p class="result-text" id="resultText" hidden></p>
        </div>
        <div class="result-foot">
          <button type="button" class="btn ghost" id="copyBtn" disabled>复制文本</button>
          <button type="button" class="btn ghost" id="clearBtn" disabled>清空结果</button>
        </div>
      </section>
    </main>

    <footer class="footnote" id="footnote">
      FastAPI · 本地开源模型推理 · 模型加载完成后可断网运行
    </footer>
  </div>

  <div class="toast-stack" id="toastStack" role="status" aria-live="polite"></div>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('statusText').textContent = '文件预览';
      document.getElementById('statusBadge').dataset.state = 'error';
      document.querySelectorAll('.lang-btn, #recordBtn, #fileInput, #clearFileBtn').forEach((control) => {
        control.disabled = true;
      });
      document.getElementById('dropzone').removeAttribute('tabindex');

      const serviceLink = document.createElement('a');
      serviceLink.href = 'http://127.0.0.1:8000/';
      serviceLink.textContent = '打开本地服务';
      document.getElementById('recordTip').replaceChildren('请先启动服务，再', serviceLink, '使用识别功能。');
    } else {
      import('/static/js/app.js');
    }
  </script>
</body>
</html>
